<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>汎用360度パノラマビューアー</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }
    #viewer {
      position: fixed;
      inset: 0;
    }
    #dropZone {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, rgba(40,40,52,.92), rgba(7,7,12,.98));
      transition: opacity .2s ease;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #dropZone.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #dropZone.dragover {
      background: radial-gradient(circle at center, rgba(70,95,140,.95), rgba(7,7,12,.98));
    }
    .panel {
      width: min(720px, 92vw);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 24px;
      background: rgba(255,255,255,.07);
      box-shadow: 0 20px 80px rgba(0,0,0,.45);
      padding: 34px 28px;
      backdrop-filter: blur(14px);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 4vw, 40px);
      letter-spacing: .02em;
    }
    p {
      margin: 8px 0;
      line-height: 1.75;
      color: rgba(255,255,255,.82);
    }
    .button {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.14);
      color: #fff;
      cursor: pointer;
      user-select: none;
    }
    #fileInput { display: none; }
    #toolbar {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 20;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border-radius: 16px;
      background: rgba(0,0,0,.42);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.12);
    }
    #toolbar button, #toolbar label {
      border: 0;
      border-radius: 999px;
      padding: 9px 13px;
      color: #fff;
      background: rgba(255,255,255,.16);
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }
    #toolbar button:hover, #toolbar label:hover, .button:hover {
      background: rgba(255,255,255,.24);
    }
    #hint {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      max-width: min(420px, calc(100vw - 32px));
      padding: 10px 14px;
      border-radius: 14px;
      color: rgba(255,255,255,.78);
      background: rgba(0,0,0,.42);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 13px;
      line-height: 1.6;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="viewer"></div>

  <div id="toolbar">
    <label for="fileInput">画像を開く</label>
    <button id="resetBtn" type="button">視点リセット</button>
    <button id="dropBtn" type="button">ドロップ画面</button>
  </div>

  <div id="hint">ドラッグで視点移動 ／ ホイールでズーム ／ 2:1の正距円筒パノラマ画像推奨</div>

  <div id="dropZone">
    <div class="panel">
      <h1>360度パノラマビューアー</h1>
      <p>ここに360度パノラマ画像をドラッグ＆ドロップしてください。</p>
      <p>JPEG / PNG / WebP対応。画像はアップロードされず、このブラウザ内だけで表示されます。</p>
      <label class="button" for="fileInput">ファイルを選択</label>
    </div>
  </div>

  <input id="fileInput" type="file" accept="image/*" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const viewer = document.getElementById('viewer');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const resetBtn = document.getElementById('resetBtn');
    const dropBtn = document.getElementById('dropBtn');

    let camera, scene, renderer, mesh, texture;
    let lon = 0, lat = 0;
    let phi = 0, theta = 0;
    let isPointerDown = false;
    let pointerDownX = 0, pointerDownY = 0;
    let lonOnPointerDown = 0, latOnPointerDown = 0;
    let fov = 75;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 1, 1100);
      camera.target = new THREE.Vector3(0, 0, 0);

      const geometry = new THREE.SphereGeometry(500, 80, 40);
      geometry.scale(-1, 1, 1);

      const placeholder = createPlaceholderTexture();
      const material = new THREE.MeshBasicMaterial({ map: placeholder });
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      viewer.appendChild(renderer.domElement);

      renderer.domElement.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      renderer.domElement.addEventListener('wheel', onWheel, { passive: false });
      window.addEventListener('resize', onWindowResize);

      setupDragAndDrop();
    }

    function createPlaceholderTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#24384f');
      grad.addColorStop(0.55, '#18212e');
      grad.addColorStop(1, '#0b0b0f');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      for (let x = 0; x < canvas.width; x += 128) ctx.fillRect(x, 0, 1, canvas.height);
      for (let y = 0; y < canvas.height; y += 128) ctx.fillRect(0, y, canvas.width, 1);
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.font = '64px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Drop panorama image', canvas.width / 2, canvas.height / 2);
      return new THREE.CanvasTexture(canvas);
    }

    function setupDragAndDrop() {
      ['dragenter', 'dragover'].forEach(type => {
        window.addEventListener(type, e => {
          e.preventDefault();
          dropZone.classList.remove('hidden');
          dropZone.classList.add('dragover');
        });
      });

      ['dragleave', 'drop'].forEach(type => {
        window.addEventListener(type, e => {
          e.preventDefault();
          dropZone.classList.remove('dragover');
        });
      });

      window.addEventListener('drop', e => {
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) loadImageFile(file);
      });

      fileInput.addEventListener('change', e => {
        const file = e.target.files && e.target.files[0];
        if (file) loadImageFile(file);
      });

      resetBtn.addEventListener('click', resetView);
      dropBtn.addEventListener('click', () => dropZone.classList.remove('hidden'));
    }

    function loadImageFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('画像ファイルを選択してください。');
        return;
      }

      const url = URL.createObjectURL(file);
      const loader = new THREE.TextureLoader();
      loader.load(url, loadedTexture => {
        if (texture) texture.dispose();
        texture = loadedTexture;
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        mesh.material.map = texture;
        mesh.material.needsUpdate = true;
        URL.revokeObjectURL(url);
        dropZone.classList.add('hidden');
        resetView();
      }, undefined, () => {
        URL.revokeObjectURL(url);
        alert('画像を読み込めませんでした。');
      });
    }

    function resetView() {
      lon = 0;
      lat = 0;
      fov = 75;
      camera.fov = fov;
      camera.updateProjectionMatrix();
    }

    function onPointerDown(event) {
      isPointerDown = true;
      pointerDownX = event.clientX;
      pointerDownY = event.clientY;
      lonOnPointerDown = lon;
      latOnPointerDown = lat;
    }

    function onPointerMove(event) {
      if (!isPointerDown) return;
      lon = (pointerDownX - event.clientX) * 0.1 + lonOnPointerDown;
      lat = (event.clientY - pointerDownY) * 0.1 + latOnPointerDown;
    }

    function onPointerUp() {
      isPointerDown = false;
    }

    function onWheel(event) {
      event.preventDefault();
      fov += event.deltaY * 0.05;
      fov = THREE.MathUtils.clamp(fov, 35, 100);
      camera.fov = fov;
      camera.updateProjectionMatrix();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      lat = Math.max(-85, Math.min(85, lat));
      phi = THREE.MathUtils.degToRad(90 - lat);
      theta = THREE.MathUtils.degToRad(lon);
      camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
      camera.target.y = 500 * Math.cos(phi);
      camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);
      camera.lookAt(camera.target);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
